name: Sincronizar BBDD y Actualizar Catálogo Web

on:
  schedule:
    # Se ejecuta automáticamente cada 12 horas (a las 06:00 y 18:00 UTC)
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    # Permite ejecutarlo manualmente con un clic desde la pestaña Actions en GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pycryptodome psycopg2-binary

      - name: Sincronizar actualizaciones de Kodi con la Base de Datos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning ::El secreto DATABASE_URL no está configurado en GitHub Secrets. Saltando sincronización de Kodi."
          else
            python scripts/sync_updates.py
          fi

      - name: Generar catálogo estático JSON
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning ::El secreto DATABASE_URL no está configurado en GitHub Secrets. Manteniendo los JSONs existentes."
          else
            python scripts/generate_catalog.py
          fi

      - name: Publicar cambios del catálogo en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: actualizar catálogo estático [skip ci]" && git push)
